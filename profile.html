<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" initial-scale="1.0">
    <title>
      Profile - MUVY
    </title>
    <link rel="stylesheet" href="styles/Profile.css">
    <link rel="stylesheet" href="styles/my-mobile-app-nav-section.css">
  </head>
  <body>

    <!--this is the profile area header section-->

    <header class="profile-header-section">
      <div class="profile-header-overall-container">
        <div class="profile-header-sub-overall-container">
          <div class="profile-content-overall">
            <section class="profile-identifier-container">
              <div class="profile-identifier-itself">
                Profile
              </div>
            </section>
            <section class="profile-settings-container">
              <img class="profile-settings" src="images/nav tools/settings_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
            </section>
          </div>
        </div>
      </div>
    </header>


    <!--this is the profile area main page-->

    <main class="profiles-main-page" style="margin-bottom: 60px;">

      <!--this section of the profile section is for the account owner profile details-->

      <section class="profile-body-section">
        <div class="profile-body-overall">
          <div class="profile-body-sub-overall">
            <div class="profile-body-content-container">
              <div class="prifle-details-container">
                <div class="profile-icon-container">
                  <img class="profile-icon-itself" src="images/pexels-photo-1030895.jpg">
                </div>
                <div class="main-profile-details-container">
                  <div class="account-name-container">
                    <h4 class="account-name">
                      Mr. Mudy
                    </h4>
                  </div>
                  <div class="account-email-address-container">
                    <a class="account-email-adress"> 
                      mymovieapp@gmail.com
                    </a>
                  </div>
                  <div class="profile-status-container">
                    <div class="profile-status">
                      Premium
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>


      <!--this section of the profile area is for the profile options-->
      <div class="options-section">
        <div class="options-overall">
          <div class="options-sub-overall">


            <!--this is the first options-->
            <section class="first-options-container">
              <div class="first-options-contents-overall">
                <div class="first-options-contents">
                  <div class="watch-history-container">
                    <div class="watch-history-itself">
                      Watch History
                    </div>
                  </div>
                  <div class="more-options-container">
                    <img class="more-options" src="images/nav tools/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
                  </div>
                </div>
                <hr>

                <div class="first-options-contents">
                  <div class="related-movies-container">
                    <div class="related-movies-itself">
                      Related Movies
                    </div>
                  </div>
                  <div class="more-options-container">
                    <img class="more-options" src="images/nav tools/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
                  </div>
                </div>
                <hr>

                <div class="first-options-contents">
                  <div class="Watchlist-container">
                    <div class="watchlist-itself">
                      Watchlist
                    </div>
                  </div>
                  <div class="more-options-container">
                    <img class="more-options" src="images/nav tools/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
                  </div>
                </div>
                <hr>

                <div class="first-options-contents">
                  <div class="Downloads-container">
                    <div class="downloads-itself">
                      Downloads
                    </div>
                  </div>
                  <div class="more-options-container">
                    <img class="more-options" src="images/nav tools/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
                  </div>
                </div>
              </div>
            </section>

            <!--this is the second options-->
            <section class="second-options-container">
              <div class="second-options-contents-overall">
                <div class="second-options-contents">
                  <div class="settings-container">
                    <div class="settings-itself">
                      Settings
                    </div>
                  </div>
                  <div class="more-options-container">
                    <img class="more-options" src="images/nav tools/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
                  </div>
                </div>
                <hr>

                <div class="second-options-contents">
                  <div class="helps-and-support-container">
                    <div class="help-and-support-itself">
                      Help & Support
                    </div>
                  </div>
                  <div class="more-options-container">
                    <img class="more-options" src="images/nav tools/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
                  </div>
                </div>
                <hr>

                <div class="second-options-contents">
                  <div class="log-out-container">
                    <div class="log-out-itself">
                      Log Out
                    </div>
                  </div>
                  <div class="more-options-container">
                    <img class="more-options" src="images/nav tools/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>


    <!--this is the bottom navigation center and it 
    should exist across the pages respectively-->


    <nav class="bottom-nav-bar">
      <div class="overall-nav-container">
        <div class="sub-overall-nav-container">
          <section class="the-navs-container">
            <a href="index.html" class="the-navs-container">
              <div>
                <img class="the-navs" src="images/nav tools/home_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                Home
              </div>
            </a>
          </section>
          <section class="the-navs-container">
            <a href="explore.html" class="the-navs-container">
              <div>
                <img class="the-navs" src="images/nav tools/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                Explore
              </div>
            </a>
          </section>
          <section class="the-navs-container">
            <a href="watchlist.html" class="the-navs-container">
              <div>
                <img class="the-navs" src="images/nav tools/favorite_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                Watchlist
              </div>
            </a>
          </section>
          <section class="the-navs-container">
            <a class="the-navs-container" href="profile.html">
              <div>
                <img class="the-navs" src="images/nav tools/account_circle_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                profile
              </div>
            </a>
          </section>
        </div>
      </div>
    </nav>
  </body>
</html>
