<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Explore - MUVY
    </title>
    <link rel="stylesheet" href="styles/explore.css">
    <link rel="stylesheet" href="styles/my-mobile-app-nav-section.css">
  </head>

  <body>

    <header class="head-section-for-the-explore-page">
      <div class="the-header-overall">
        <div class="the-header-sub-overall-container">
          <section class="prev-page">
            <button class="back-button" id="backButton">
              <img class="explore-prev-icon" src="images/nav tools/arrow_back_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
            </button>
          </section>
          <section class="search-identification-container">
            <h3 class="the-identification">
              Search
            </h3>
          </section>
        </div>
      </div>
    </header>

    <main class="the-explore-main-page">

      <div class="the-explore-section">
        <section class="the-explore-main-contents-container">
          <div class="sub-explore-main-contents-container">
            <div class="first-container-for-sercharea-and-genre-selection">
              <div class="the-explore-search-container">
                <img class="explore-search-icon" src="images/nav tools/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
                <input class="the-actual-search-area" type="text" placeholder="Search movies, actors, genres...">
              </div>

              <div class="container-for-the-genre-selection">
                <img class="the-actual-genre-selection" src="images/nav tools/menu_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
              </div>
            </div>
          </div>
        </section>

        <section class="the-explore-navigations">
          <div class="overall-container-of-the-explore-navigations">
            <div class="sub-overall-of-the-explore-navigations">
              <div class="container-for-the-genre-identification">
                <h3 class="the-genre-indentification-itself">
                  Genres
                </h3>
              </div>
              <div class="the-nav-buttons-direct-container">
                <div class="all-button-container">
                  All
                </div>
                <div class="the-action-button-container">
                  Action
                </div>
                <div class="the-sel-fi-button-container">
                  Sel-fi
                </div>
                <div class="the-thriller-button-container">
                  Thriller
                </div>
                <div class="Drama-button-container">
                  Drama
                </div>
                <div class="Mystrey-button-container">
                  Mystrey
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="Trending-videos-overall-container">
          <div class="sub-trending-videos-overall-container">
            <div class="the-trending-identification-container">
              <h3 class="the-trending-itself">
                Trending
              </h3>
            </div>
            <div class="everything-trending">
              <div class="the-videos-container">
                <img class="explore-trending-video-posters" src="images/349fb1eb-657d-4370-ab65-a6c2479800a6.jfif">
              </div>
              <div class="the-videos-container">
                <img class="explore-trending-video-posters" src="images/809d7f90-1464-452e-af18-a321fe0fa209.jfif">
              </div>
              <div class="the-videos-container">
                <img class="explore-trending-video-posters" src="images/22bab4cf-813a-4732-bd72-88b2d6c430fa.jfif">
              </div>
              <div class="the-videos-container">
                <img class="explore-trending-video-posters" src="images/8ad76670-73ea-4ad7-b646-8d81ceb32244.jfif">
              </div>
              <div class="the-videos-container">
                <img class="explore-trending-video-posters" src="images/New folder/11db61d7-6216-493c-9be0-2c440a9c0ec6.jfif">
              </div>
              <div class="the-videos-container">
                <img class="explore-trending-video-posters" src="images/New folder/268a8853-9600-4764-a7ee-4a80a453b72c.jfif">
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>


    <!--this is the bottom navigation center and it 
    should exist across the pages respectively-->

    <nav class="bottom-nav-bar">
      <div class="overall-nav-container">
        <div class="sub-overall-nav-container">
          <section class="the-navs-container">
            <a href="index.html">
              <div>
                <img class="the-navs" src="images/nav tools/home_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                Home
              </div>
            </a>
          </section>
          <section class="the-navs-container">
            <a href="explore.html" class="the-navs-container">
              <div>
                <img class="the-navs" src="images/nav tools/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                Explore
              </div>
            </a>
          </section>
          <section class="the-navs-container">
            <div>
              <img class="the-navs" src="images/nav tools/favorite_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
            </div>
            <div class="bottom-navigation-identification">
              Watchlist
            </div>
          </section>
          <section class="the-navs-container">
            <div>
              <img class="the-navs" src="images/nav tools/account_circle_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
            </div>
            <div class="bottom-navigation-identification">
              profile
            </div>
          </section>
        </div>
      </div>
    </nav>
    

    <script src="JavaScript/Script.js"></script>
  </body>
</html>
