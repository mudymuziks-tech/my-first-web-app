<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUVY</title>
    <meta name="description" content="a modern movie website.">
    <link rel="stylesheet" href="styles/first-section-movie-app.css">
    <link rel="stylesheet" href="styles/head-section.css">
    <link rel="stylesheet" href="styles/my-mobile-app-nav-section.css">
    <link rel="stylesheet" href="styles/explore.css">
    <link rel="stylesheet" href="styles/watchlist.css">
    <link rel="stylesheet" href="styles/Profile.css">
  </head>
  <body class="the-body">


    <!--this is the header for the first main page-->
    
    <header class="head-section">
      <div class="header-content-container">
        <section class="menu-bar-container">
          <div class="menu-bar-container">
            <img id="menuBtn" class="menu-bar" src="images/nav tools/menu_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg">
          </div>
          <div id="menu" class="the-menus-overall">
            <div class="delete-button-container">
              <div class="delete-button">
                X
              </div>
            </div>
            <div class="the-menus-sub-overall">
              <div class="the-menus-content-container">
                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="the-watch-history">
                    Watchistory
                  </div>
                </div>

                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="the-related-movies">
                    Related Movies
                  </div>
                </div>

                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="the-watchlist">
                    Watchlist
                  </div>
                </div>

                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="the-downloads">
                    Downloads
                  </div>
                </div>

                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="the-settings">
                    Settings
                  </div>
                </div>

                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="the-help-and-support">
                    Help & Support
                  </div>
                </div>

                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="the-log-out">
                    Log Out
                  </div>
                </div>

                <div class="indicator-and-contents">
                  <div class="indicator"></div>
                  <div class="light-and-dark">
                    light & Dark mode
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section class="logo-container">
          <div class="identity-container">
            <div class="name-and-logo-container">
              <div class="video-container">
                <img class="video" src="images/settings_input_svideo_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>

              <div class="app-slogan">
                <h1 class="app-name">
                  MU<span class="for-separate-color">V</span>Y
                </h1>
              </div>
            </div>
          </div>
        </section>
        <section class="search-area-container">
          <img class="header-search-area" src="images/nav tools/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
        </section>
      </div>
    </header>
    
    <!--this is the first main page-->

    <main class="the-first-main-page">
      <section class="first-section-movie-app">
        <div class="first-overall-container-first-section">
          <div class="sub-overall-container-first-section">
            <div class="first-section-content-container">
              <img class="my-app-background-image" src="images/New folder/6a25f44e-59f5-4c21-b903-0172a0dd2059.jfif">
              <div class="first-background-content-container-first-section">
                <h1 class="the-first-background-content-itself">
                  Find your<br>next<span>obsession.</span>
                </h1>
              </div>
              <div class="second-background-content-container-first-section">
                <img class="search-icon" src="images/nav tools/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
                <input id="movieSearch" class="the-search-area" type="text" placeholder="Search movies, actors,  genres...">
              </div>
              <p id="searchResult"></p>
            </div>
            <div></div>
          </div>
        </div>
      </section>



      <!--the trending section-->
      <div class="second-section">
        <div class="immediate-container-to-the-second-section">
          <div class="sub-immediate-container-to-the-second-section">
            <section class="first-place-content-container">
              <div class="container-to-trending-now">
                <h4 class="trending-now">Trending Now</h4>
              </div>
              <div class="container-to-see-all">
                <p class="see-all">
                  See all
                </p>
              </div>
            </section>

            <section class="second-section-second-division-overall">
              <div class="second-section-second-division-overall-container">
                <div class="second-section-image-container1">
                  <img class="second-section-trending-movie-poster-itself" src="images/349fb1eb-657d-4370-ab65-a6c2479800a6.jfif">
                </div>
                <div class="second-section-image-container2">
                  <img class="second-section-trending-movie-poster-itself" src="images/809d7f90-1464-452e-af18-a321fe0fa209.jfif">
                </div>
                <div class="second-section-image-container3">
                  <img class="second-section-trending-movie-poster-itself" src="images/22bab4cf-813a-4732-bd72-88b2d6c430fa.jfif">
                </div>
                <div class="second-section-image-container4">
                  <img class="second-section-trending-movie-poster-itself" src="images/8ad76670-73ea-4ad7-b646-8d81ceb32244.jfif">
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>

      <!--weekly trending section-->

      <div class="weekly-trending-videos">
        <div class="overall-container-of-the-weekly-trends">
          <div class="sub-overall-container-of-the-weekly-trends">
            <section class="weekly-trend-first-content-container">
              <div class="popular-this-week-container">
                <h4 class="popular-this-week">
                  Popular This Week
                </h4>
              </div>
              <div class="on-weekly-popular-see-more">
                <div class="see-all-tag">See all</div>
              </div>
            </section>
            <section class="overall-container-to-the-weekly-trending-videos">
              <div class="one-of-the-trending-videos-container">
                <img class="video-previews" src="images/New folder/11db61d7-6216-493c-9be0-2c440a9c0ec6.jfif">
              </div>
              <div class="one-of-the-trending-videos-container">
                <img class="video-previews" src="images/New folder/268a8853-9600-4764-a7ee-4a80a453b72c.jfif">
              </div>
              <div class="one-of-the-trending-videos-container">
                <img class="video-previews" src="images/New folder/38fd25ee-3093-408b-8e8e-426535a7a7dd.jfif">
              </div>
              <div class="one-of-the-trending-videos-container">
                <img class="video-previews" src="images/New folder/5c889bc9-4494-4ccf-a19f-640a40ddfd2b.jfif">
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

    should exist across the pages respectively-->

              </div>
              <div class="bottom-navigation-identification">

              </div>

          <section class="the-navs-container">

                <img class="the-navs" src="images/nav tools/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                Explore
              </div>
            </a>
          </section>
          <section class="the-navs-container">
            <a href="watchlist.html" class="the-navs-container">
              <div>
                <img class="the-navs" src="images/nav tools/favorite_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                Watchlist
              </div>
            </a>
          </section>
          <section class="the-navs-container">
            <a class="the-navs-container" href="profile.html">
              <div>
                <img class="the-navs" src="images/nav tools/account_circle_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
              </div>
              <div class="bottom-navigation-identification">
                profile

</html>
